# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-10

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crpch10.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_1BF61A6BBBB44BE8AA7A5A969A8AF00B }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D63A43E1A51646C8A824683D4550ED5D }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crpch10.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_1BF61A6BBBB44BE8AA7A5A969A8AF00B }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-10'
          slot-name: 'staging'
          images: 'crpch10.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_1BF61A6BBBB44BE8AA7A5A969A8AF00B }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9B61067950404636A69F4AC54AC82A8E }}